apiVersion: apps/v1
kind: Deployment
metadata:
  name: campus-navigator
  labels:
    app: campus-navigator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: campus-navigator
  template:
    metadata:
      labels:
        app: campus-navigator
    spec:
      containers:
        - name: campus-navigator
          image: DOCKERHUB_USERNAME/smart-campus-route-optimizer:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 5000
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 256Mi
